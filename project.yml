name: Catris
options:
  bundleIdPrefix: com.jaxcater
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  CatrisCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone Portrait v1
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  Catris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CatrisApp
        excludes:
          - Assets/**
          - Info.plist
      - path: Sources/CatrisApp/Assets/Assets.xcassets
      - path: Sources/CatrisApp/Assets/Meshes
        buildPhase: resources
        type: folder
      - path: Sources/CatrisApp/Assets/Textures
        buildPhase: resources
        type: folder
      - path: Sources/CatrisApp/Assets/Audio
        buildPhase: resources
        type: folder
      - path: Sources/CatrisApp/Assets/Data
        buildPhase: resources
        type: folder
    dependencies:
      - package: CatrisCore
        product: CatrisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaxcater.catris
        PRODUCT_NAME: Catris
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/CatrisApp/Info.plist
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    scheme:
      testTargets: []
      gatherCoverageData: false
